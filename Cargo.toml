[package]
name = "mcptunnel"
version = "0.3.0"
edition = "2021"
description = "A local MCP gateway that bridges stdio MCP servers to localhost or temporary public HTTPS via Cloudflare Tunnel"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/mcptunnel/mcptunnel"
readme = "README.md"
include = ["Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "src/**", "tests/**", "examples/**", "scripts/**", "docs/*.md", "docs/*.csv", "docs/*.json"]

[[bin]]
name = "mcptunnel"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
process-wrap = { version = "10.0.1", features = ["tokio1"] }

# HTTP server
axum = { version = "0.8", features = ["macros"] }
hyper = { version = "1" }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# MCP protocol
rmcp = { version = "3.5.1", features = ["client", "transport-child-process", "transport-streamable-http-server"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"

# IDs and randomness
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"

# Auth
jsonwebtoken = "9"
reqwest = { version = "0.12", features = ["json"] }
rsa = { version = "0.9", features = ["pem"] }

# Networking
ipnet = "2"
url = "2"

# Platform paths
directories = "5"

# Error handling
thiserror = "2"
anyhow = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async utilities
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
futures = "0.3"

# SHA-256 for session ID hashing in logs
sha2 = "0.10"
hex = "0.4"

# Base64 for HTTP Basic Auth
base64 = "0.22"
subtle = "2"

[dev-dependencies]
tempfile = "3"
