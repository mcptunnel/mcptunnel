[package]
name = "mcptunnel"
version = "0.1.0"
edition = "2021"
description = "A local MCP gateway that bridges stdio MCP servers to public HTTPS endpoints via Cloudflare Tunnel"
license = "MIT"
rust-version = "1.75"

[[bin]]
name = "mcptunnel"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
axum = { version = "0.8", features = ["macros"] }
hyper = { version = "1" }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# MCP protocol
rmcp = { version = "1.3", features = ["client", "transport-child-process"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"

# IDs and randomness
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"

# Auth
jsonwebtoken = "9"
reqwest = { version = "0.12", features = ["json"] }

# Networking
ipnet = "2"

# Platform paths
directories = "5"

# Error handling
thiserror = "2"
anyhow = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async utilities
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
futures = "0.3"

# SHA-256 for session ID hashing in logs
sha2 = "0.10"
hex = "0.4"

# Base64 for HTTP Basic Auth
base64 = "0.22"
subtle = "2"

[dev-dependencies]
tempfile = "3"
